apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: matchlytics
  labels:
    app: matchlytics
    component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matchlytics
      component: dashboard
  template:
    metadata:
      labels:
        app: matchlytics
        component: dashboard
    spec:
      containers:
        - name: dashboard
          image: matchlytics-dashboard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          # Nur API_URL aus der ConfigMap, keine Datenbank-Zugangsdaten
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: matchlytics-config
                  key: API_URL
            # Streamlit prueft bei WebSocket-Verbindungen, von welchem Host die Seite geladen wurde.
            # Hinter dem Ingress ist das matchlytics.localhost, sonst wird die Verbindung abgelehnt.
            - name: STREAMLIT_BROWSER_SERVER_ADDRESS
              value: matchlytics.localhost
