# Wegwerf-Pod zum Pruefen von ConfigMap und Secret. Nicht dauerhaft im Cluster lassen.
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: matchlytics
spec:
  restartPolicy: Never
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sleep", "3600"]
      envFrom:
        - configMapRef:
            name: matchlytics-config
        - secretRef:
            name: matchlytics-secrets
      volumeMounts:
        - name: config-volume
          mountPath: /etc/matchlytics-config
  volumes:
    - name: config-volume
      configMap:
        name: matchlytics-config
