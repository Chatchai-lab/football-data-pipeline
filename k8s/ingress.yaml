apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matchlytics
  namespace: matchlytics
spec:
  # k3s bringt Traefik als Ingress-Controller mit
  ingressClassName: traefik
  rules:
    - host: matchlytics.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
