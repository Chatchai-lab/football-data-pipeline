apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: matchlytics
  labels:
    app: matchlytics
    component: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchlytics
      component: pushgateway
  template:
    metadata:
      labels:
        app: matchlytics
        component: pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.10.0
          ports:
            - containerPort: 9091
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9091
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: matchlytics
  labels:
    app: matchlytics
    component: pushgateway
spec:
  type: ClusterIP
  selector:
    app: matchlytics
    component: pushgateway
  ports:
    - port: 9091
      targetPort: 9091
