# Prometheus darf die Kubernetes-API nach Pods und Endpunkten im Namespace fragen (nur lesen).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: matchlytics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: matchlytics
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: matchlytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: matchlytics
