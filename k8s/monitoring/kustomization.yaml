apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Monitoring als Zusatz zur Anwendung: kubectl apply -k k8s/monitoring
# Voraussetzung: Namespace matchlytics existiert (kubectl apply -k k8s).
resources:
  - prometheus-config.yaml
  - prometheus-rbac.yaml
  - prometheus.yaml
  - pushgateway.yaml
