apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: matchlytics
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Die API: Prometheus fragt die Kubernetes-API nach den Endpunkten des Services "api"
      # und holt von jedem Pod einzeln /metrics ab. So wird jeder Pod gemessen, nicht nur
      # der, den der Service gerade auswaehlt. Neue Pods werden automatisch gefunden.
      - job_name: matchlytics-api
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [matchlytics]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Das Pushgateway haelt die Werte der kurzlebigen Pipeline-Laeufe.
      # honor_labels: Die Labels aus dem Push (job, instance) bleiben erhalten.
      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets: ["pushgateway:9091"]
