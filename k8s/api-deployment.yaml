apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: matchlytics
  labels:
    app: matchlytics
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matchlytics
      component: api
  template:
    metadata:
      labels:
        app: matchlytics
        component: api
    spec:
      containers:
        - name: api
          image: matchlytics-api:dev
          # Das Image liegt nur lokal in k3s, nicht in einer Registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Einstellungen (DB_HOST, DB_PORT, DB_NAME, DB_SSLMODE, LOG_LEVEL ...) aus der ConfigMap.
          # Das Secret wird bewusst NICHT per envFrom eingebunden: Es enthaelt die Zugangsdaten des
          # Admin-Benutzers, die API soll aber nur die Read-only-Rolle bekommen.
          envFrom:
            - configMapRef:
                name: matchlytics-config
          env:
            - name: DB_USER
              value: api_ro
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matchlytics-secrets
                  key: API_RO_PASSWORD
            # Verbindungspool pro Pod: bis zu 20 Verbindungen (10 + 10), wer keine bekommt, wartet hoechstens
            # 5 s und bekommt dann einen 503. Bei drei Replikas sind das hoechstens 60 von 100 erlaubten
            # Postgres-Verbindungen. Gemessen im Lasttest, siehe docs/loadtest.md.
            - name: DB_POOL_SIZE
              value: "10"
            - name: DB_MAX_OVERFLOW
              value: "10"
            - name: DB_POOL_TIMEOUT
              value: "5"
          # Readiness: bekommt der Pod Traffic? /ready prueft auch die Datenbank.
          # Schlaegt sie fehl, nimmt der Service den Pod aus der Verteilung, der Pod bleibt aber am Leben.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: lebt der Prozess noch? Bewusst /health ohne Datenbank.
          # Wuerde die Liveness-Probe die DB pruefen, wuerde ein kurzer DB-Ausfall alle API-Pods neu starten.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Gemessen im Leerlauf: ca. 2m CPU und 42-44 Mi RAM. Requests liegen darueber,
          # das Speicher-Limit gibt etwa den dreifachen Spielraum.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

