apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: matchlytics
  labels:
    app: matchlytics
    component: api
spec:
  type: ClusterIP
  # Der Service schickt Anfragen an alle Pods mit diesen Labels
  selector:
    app: matchlytics
    component: api
  ports:
    - port: 80
      targetPort: 8000
