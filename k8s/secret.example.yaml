# Beispiel mit Platzhaltern. Das echte Secret (k8s/secret.yaml) wird NICHT committet.
# Echtes Secret lokal erzeugen:
#   kubectl create secret generic matchlytics-secrets --from-env-file=<datei> -n matchlytics
apiVersion: v1
kind: Secret
metadata:
  name: matchlytics-secrets
  namespace: matchlytics
type: Opaque
stringData:
  DB_USER: "<db-user>"
  DB_PASSWORD: "<db-password>"
  FOOTBALL_API_KEY: "<api-key-or-dummy>"
