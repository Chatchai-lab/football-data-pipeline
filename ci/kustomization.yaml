apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay fuer den Deploy-Test in der CI: nimmt die Basis und setzt die Image-Tags.
# "ci" ist ein Platzhalter, der Workflow ersetzt ihn durch die Commit-ID.
resources:
  - ../k8s

images:
  - name: matchlytics-api
    newTag: ci
  - name: matchlytics-dashboard
    newTag: ci
  - name: matchlytics-pipeline
    newTag: ci
